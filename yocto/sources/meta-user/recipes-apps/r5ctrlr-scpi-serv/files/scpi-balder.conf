##### this is the init sequence for Balder vertical beam control
# *rst
FSAMPL 1000
CTRLLOOP ON
##### CH1 is the actual controller
CTRLLOOP:MATRIXROW A 1 0 1 -1 0 0
CTRLLOOP:MATRIXROW B 1 0 1 1 0 0
CTRLLOOP:MATRIXROW C 1 0 0 0 0 0
CTRLLOOP:MATRIXROW D 1 1 0 0 0 0
CTRLLOOP:CH:IN_SELECT 1 5
CTRLLOOP:CH:PID:GAINS 1 2 0 0.015 0 0 1
CTRLLOOP:CH:PID:THRESHOLDS 1 2 0 0.045
DAC:CH:OUT_SELECT 1 5
DAC:CH:OFFSET 1 1638
# CTRLLOOP:CH:STATE 1 ON
##### CH2 is beam intensity
CTRLLOOP:MATRIXROW A 2 0 0 0 0 0
CTRLLOOP:MATRIXROW B 2 1 0 0 0 0
CTRLLOOP:MATRIXROW C 2 0 0.5 0.5 0 0
CTRLLOOP:MATRIXROW D 2 1 0 0 0 0
CTRLLOOP:CH:IIR:COEFF 2 1 0.00095081452 0.001901629 0.00095081452 -1.9235837 0.927387
CTRLLOOP:CH:IN_SELECT 2 5
DAC:CH:OUT_SELECT 2 5
CTRLLOOP:CH:STATE 2 ON
##### CH3 is beam position monitor
CTRLLOOP:MATRIXROW A 3 0 0 0 0 0
CTRLLOOP:MATRIXROW B 3 1 0 0 0 0
CTRLLOOP:MATRIXROW C 3 0 1 -1 0 0
CTRLLOOP:MATRIXROW D 3 0 1 1 0 0
CTRLLOOP:CH:IN_SELECT 3 5
CTRLLOOP:CH:IIR:COEFF 3 1 0.00095081452 0.001901629 0.00095081452 -1.9235837 0.927387
DAC:CH:OUT_SELECT 3 5
CTRLLOOP:CH:STATE 3 ON
##### CH4 is not used
