# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-vivadoprj"
BBFILE_PATTERN_meta-vivadoprj = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-vivadoprj = "6"

LAYERDEPENDS_meta-vivadoprj = "core"
LAYERSERIES_COMPAT_meta-vivadoprj = "scarthgap"
